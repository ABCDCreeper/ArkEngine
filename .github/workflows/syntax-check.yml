name: syntax-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Syntax check
        run: python -m compileall -q app tests run.py
      - name: Lint check
        run: ruff check --select F app tests run.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
